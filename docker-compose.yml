# ============================================================================
# Container Sentinel — Docker Compose Scaffold
#
# Services:
#   app           — Node.js planner/REST server
#   api           — authenticated Python dashboard/data API
#   dashboard     — Next.js operations dashboard
#   postgres      — PostgreSQL 16 (metadata + scan results)
#   redis         — Redis 7 (Celery broker / result backend)
#   celery-worker — Python Celery worker (runs Trivy / Grype scans)
#   celery-beat   — Celery Beat scheduler for periodic scan tasks
#
# Usage:
#   cp .env.example .env        # edit variables as needed
#   docker compose up --build   # first run
#   docker compose up -d        # subsequent runs
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Node.js Planner Server (Express/HTTP API)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrutineering-app
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PLANNER_PORT:-3000}:${PLANNER_PORT:-3000}"
    env_file:
      - .env
    environment:
      - PLANNER_HOST=0.0.0.0
      - PLANNER_PORT=${PLANNER_PORT:-3000}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PLANNER_PORT:-3000}/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Python API — authenticated read-only dashboard/data boundary
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scrutineering-api
    user: "api"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PYTHON_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - PYTHON_API_KEY=${PYTHON_API_KEY:-${PLANNER_API_KEY:?PLANNER_API_KEY must be set in .env}}
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-}
      - SERVICE_AUTH_REQUIRED=${SERVICE_AUTH_REQUIRED:-false}
      - DASHBOARD_TRUSTED_PROXY_SECRET=${DASHBOARD_TRUSTED_PROXY_SECRET:-}
      - DASHBOARD_DEFAULT_ROLES=${DASHBOARD_DEFAULT_ROLES:-dashboard,operator}
      - REMEDIATION_APPROVAL_SECRET=${REMEDIATION_APPROVAL_SECRET:-}
      - REMEDIATION_EXECUTION_ENABLED=${REMEDIATION_EXECUTION_ENABLED:-false}
      - REMEDIATION_REPOSITORY_ROOT=${REMEDIATION_REPOSITORY_ROOT:-}
      - REMEDIATION_EVIDENCE_FILE=${REMEDIATION_EVIDENCE_FILE:-}
      - REMEDIATION_EVIDENCE_ARTIFACT_FILE=${REMEDIATION_EVIDENCE_ARTIFACT_FILE:-}
      - REMEDIATION_VALIDATION_PROVIDER=${REMEDIATION_VALIDATION_PROVIDER:-}
      - REMEDIATION_VALIDATION_ECOSYSTEM=${REMEDIATION_VALIDATION_ECOSYSTEM:-}
      - REMEDIATION_ALLOWED_REPOSITORIES=${REMEDIATION_ALLOWED_REPOSITORIES:-}
      - REMEDIATION_PUBLICATION_ENABLED=${REMEDIATION_PUBLICATION_ENABLED:-false}
      - REMEDIATION_PUBLICATION_STALE_SECONDS=${REMEDIATION_PUBLICATION_STALE_SECONDS:-900}
      - REMEDIATION_PUBLICATION_ESCALATION_CYCLES=${REMEDIATION_PUBLICATION_ESCALATION_CYCLES:-3}
      - REMEDIATION_EVIDENCE_RETENTION_DAYS=${REMEDIATION_EVIDENCE_RETENTION_DAYS:-365}
      - REMEDIATION_EVIDENCE_PURGE_ENABLED=${REMEDIATION_EVIDENCE_PURGE_ENABLED:-false}
      - REMEDIATION_ALERT_DELIVERY_ENABLED=${REMEDIATION_ALERT_DELIVERY_ENABLED:-false}
      - REMEDIATION_MAX_CHANGED_FILES=${REMEDIATION_MAX_CHANGED_FILES:-50}
      - REMEDIATION_COMMAND_OUTPUT_BYTES=${REMEDIATION_COMMAND_OUTPUT_BYTES:-2000}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-}
      - SCRUTINEERING_VERSION=${SCRUTINEERING_VERSION:-1.0}
      - SCRUTINEERING_REVISION=${SCRUTINEERING_REVISION:-local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Next.js Dashboard — local UI and dashboard API routes
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: scrutineering-dashboard
    user: "dashboard"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - DASHBOARD_API_URL=${DASHBOARD_API_URL:-http://api:8000}
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:-${PYTHON_API_KEY:-${PLANNER_API_KEY:?PLANNER_API_KEY must be set in .env}}}
      - DASHBOARD_TRUSTED_PROXY_SECRET=${DASHBOARD_TRUSTED_PROXY_SECRET:-}
    depends_on:
      app:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/dashboard"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — persistent metadata, scan results, remediation state
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: scrutineering-postgres
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-scrutineering}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-scrutineering}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrutineering} -d ${POSTGRES_DB:-scrutineering}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — Celery broker and result backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: scrutineering-redis
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Celery Worker — vulnerability scanning (Trivy + Grype)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scrutineering-celery-worker
    user: "scanner"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL:-info}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - CELERY_QUEUES=${CELERY_QUEUES:-scan.low,scan.normal,scan.high,remediation.normal}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - TRIVY_SEVERITY=${TRIVY_SEVERITY:-CRITICAL,HIGH}
      - GRYPE_SEVERITY_THRESHOLD=${GRYPE_SEVERITY_THRESHOLD:-High}
      - SCANNER_TIMEOUT=${SCANNER_TIMEOUT:-1800}
      - SCANNER_CACHE_DIR=${SCANNER_CACHE_DIR:-/tmp/scanner-cache}
      - GRYPE_DB_CACHE_DIR=${GRYPE_DB_CACHE_DIR:-/tmp/grype}
      - SCANNER_MAX_OUTPUT_BYTES=${SCANNER_MAX_OUTPUT_BYTES:-50000000}
      - SCANNER_MAX_FINDINGS=${SCANNER_MAX_FINDINGS:-100000}
      - REMEDIATION_MAX_CHANGED_FILES=${REMEDIATION_MAX_CHANGED_FILES:-50}
      - REMEDIATION_COMMAND_OUTPUT_BYTES=${REMEDIATION_COMMAND_OUTPUT_BYTES:-2000}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "python", "-c", "import src.scan.tasks"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler (scheduled scan orchestration)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scrutineering-celery-beat
    user: "scanner"
    command: >
      celery --app=src.scan.tasks:app beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --scheduler celery.beat:PersistentScheduler
      --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - SCHEDULE_CRON_SCAN=${SCHEDULE_CRON_SCAN:-0 */6 * * *}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering

# ---------------------------------------------------------------------------
# Shared network for all services
# ---------------------------------------------------------------------------
networks:
  scrutineering:
    driver: bridge

# ---------------------------------------------------------------------------
# Persistent volume for PostgreSQL data
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
