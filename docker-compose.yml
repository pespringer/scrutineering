# ============================================================================
# Container Sentinel — Docker Compose Scaffold
#
# Services:
#   api           — authenticated Python dashboard/data API
#   dashboard     — Next.js operations dashboard
#   postgres      — PostgreSQL 16 (metadata + scan results)
#   redis         — Redis 7 (Celery broker / result backend)
#   registry      — local OCI registry for disposable image workflows
#   celery-worker — Python Celery worker (runs Trivy / Grype scans)
#   celery-beat   — Celery Beat scheduler for periodic scan tasks
#
# Usage:
#   cp .env.example .env        # edit variables as needed
#   docker compose up --build   # first run
#   docker compose up -d        # subsequent runs
# ============================================================================

services:
  # PYTHON_API_KEY authenticates the dashboard to the API. PLANNER_API_KEY is
  # still accepted as a fallback for .env files created before the planner
  # service was removed.
  # ---------------------------------------------------------------------------
  # Python API — authenticated read-only dashboard/data boundary
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scrutineering-api
    user: "api"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PYTHON_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - PYTHON_API_KEY=${PYTHON_API_KEY:-${PLANNER_API_KEY:?PYTHON_API_KEY must be set in .env}}
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-}
      - SERVICE_AUTH_REQUIRED=${SERVICE_AUTH_REQUIRED:-false}
      - DASHBOARD_TRUSTED_PROXY_SECRET=${DASHBOARD_TRUSTED_PROXY_SECRET:-}
      - DASHBOARD_DEFAULT_ROLES=${DASHBOARD_DEFAULT_ROLES:-dashboard,operator}
      - REMEDIATION_EXECUTION_ENABLED=${REMEDIATION_EXECUTION_ENABLED:-false}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - SCRUTINEERING_VERSION=${SCRUTINEERING_VERSION:-1.0}
      - SCRUTINEERING_REVISION=${SCRUTINEERING_REVISION:-local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Next.js Dashboard — local UI and dashboard API routes
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: scrutineering-dashboard
    user: "dashboard"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - DASHBOARD_API_URL=${DASHBOARD_API_URL:-http://api:8000}
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:-${PYTHON_API_KEY:-${PLANNER_API_KEY:?PYTHON_API_KEY must be set in .env}}}
      - DASHBOARD_AUTH_MODE=${DASHBOARD_AUTH_MODE:-local}
      - DASHBOARD_TRUSTED_PROXY_SECRET=${DASHBOARD_TRUSTED_PROXY_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/dashboard"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — persistent metadata, scan results, remediation state
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: scrutineering-postgres
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-scrutineering}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-scrutineering}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrutineering} -d ${POSTGRES_DB:-scrutineering}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — Celery broker and result backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: scrutineering-redis
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Local OCI Registry — disposable image push/pull target for development
  # ---------------------------------------------------------------------------
  registry:
    image: registry:2
    container_name: scrutineering-registry
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LOCAL_REGISTRY_PORT:-5000}:5000"
    volumes:
      - registrydata:/var/lib/registry
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/v2/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Celery Worker — vulnerability scanning (Trivy + Grype)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scrutineering-celery-worker
    user: "scanner"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL:-info}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - CELERY_QUEUES=${CELERY_QUEUES:-scan.low,scan.normal,scan.high,remediation.normal}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - SCANNER_TIMEOUT=${SCANNER_TIMEOUT:-1800}
      - SCANNER_RETRY_ATTEMPTS=${SCANNER_RETRY_ATTEMPTS:-2}
      - SCANNER_RETRY_BACKOFF_SECONDS=${SCANNER_RETRY_BACKOFF_SECONDS:-5}
      - REQUIRE_IMMUTABLE_SCAN_IDENTITY=${REQUIRE_IMMUTABLE_SCAN_IDENTITY:-false}
      - SCANNER_CACHE_DIR=${SCANNER_CACHE_DIR:-/tmp/scanner-cache}
      - GRYPE_DB_CACHE_DIR=${GRYPE_DB_CACHE_DIR:-/tmp/grype}
      - LOCAL_REGISTRY_HOST=${LOCAL_REGISTRY_HOST:-registry:5000}
      - REGISTRY_INSECURE=${REGISTRY_INSECURE:-true}
      - SCANNER_MAX_OUTPUT_BYTES=${SCANNER_MAX_OUTPUT_BYTES:-50000000}
      - SCANNER_MAX_FINDINGS=${SCANNER_MAX_FINDINGS:-100000}
      - SCAN_COOLDOWN_SECONDS=${SCAN_COOLDOWN_SECONDS:-3600}
      - SCAN_RUNTIME_DISCOVERY_ENABLED=${SCAN_RUNTIME_DISCOVERY_ENABLED:-false}
      - SCAN_RUNTIME_USE_CONTAINERD=${SCAN_RUNTIME_USE_CONTAINERD:-false}
      - SCAN_RUNTIME_INCLUDE_IMAGES=${SCAN_RUNTIME_INCLUDE_IMAGES:-}
      - SCAN_RUNTIME_EXCLUDE_IMAGES=${SCAN_RUNTIME_EXCLUDE_IMAGES:-}
      - SCAN_RUNTIME_EXCLUDE_CONTAINERS=${SCAN_RUNTIME_EXCLUDE_CONTAINERS:-}
      - SCAN_RUNTIME_INCLUDE_LABEL=${SCAN_RUNTIME_INCLUDE_LABEL:-}
      - SCAN_RUNTIME_MAX_IMAGES=${SCAN_RUNTIME_MAX_IMAGES:-100}
      - REMEDIATION_EXECUTION_ENABLED=${REMEDIATION_EXECUTION_ENABLED:-false}
      - REMEDIATION_SOURCES_ROOT=/workspace/sources
      - BUILDKIT_HOST=tcp://buildkitd:1234
    volumes:
      # Image sources that remediations patch: one git repository per folder, read-only.
      - ${REMEDIATION_HOST_SOURCES:-./.local/remediation-sources}:/workspace/sources:ro
    depends_on:
      buildkitd:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "python", "-c", "import src.scan.tasks"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 512M

  # ---------------------------------------------------------------------------
  # BuildKit — builds remediation candidate images (rootless; no Docker socket)
  # ---------------------------------------------------------------------------
  buildkitd:
    image: moby/buildkit:v0.16.0-rootless
    container_name: scrutineering-buildkitd
    # Rootless BuildKit needs user namespaces; these options relax only this container's
    # seccomp/AppArmor profiles so it can create them. It is reachable only on the internal network.
    command: ["--addr", "tcp://0.0.0.0:1234", "--oci-worker-no-process-sandbox"]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - buildkit-cache:/home/user/.local/share/buildkit
    restart: unless-stopped
    networks:
      - scrutineering
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler (scheduled scan orchestration)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scrutineering-celery-beat
    user: "scanner"
    command: >
      celery --app=src.scan.tasks:app beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --scheduler celery.beat:PersistentScheduler
      --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - SCHEDULE_CRON_SCAN=${SCHEDULE_CRON_SCAN:-0 */6 * * *}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scrutineering

# ---------------------------------------------------------------------------
# Shared network for all services
# ---------------------------------------------------------------------------
networks:
  scrutineering:
    driver: bridge

# ---------------------------------------------------------------------------
# Persistent volume for PostgreSQL data
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  registrydata:
    driver: local
  buildkit-cache:
    driver: local
