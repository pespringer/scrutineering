name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  TRIVY_SEVERITY: CRITICAL,HIGH
  GRYPE_SEVERITY_THRESHOLD: High

jobs:
  # ------------------------------------------------
  # Repository checks — docs links, deployment and frontend config
  # ------------------------------------------------
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make check

  # ------------------------------------------------
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm audit --audit-level=high
      - working-directory: dashboard
        run: npm run validate:build

  # ------------------------------------------------
  # Formatting (advisory until Phase 3 of docs/RESET-PLAN.md reformats the code)
  # ------------------------------------------------
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Ruff format check
        continue-on-error: true
        run: uvx ruff@0.6.9 format --check src tests
      - name: Prettier check
        continue-on-error: true
        working-directory: dashboard
        run: npx --yes prettier@3.3.3 --check "src/**/*.{ts,tsx,css}"

  # ------------------------------------------------
  # Python Services — lint, test
  # ------------------------------------------------
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest tests/ -v

  # ------------------------------------------------
  # Docker build (API + worker + dashboard images)
  # ------------------------------------------------
  docker-build:
    needs: [repo-checks, test-python]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t scrutineering-api:ci .
      - run: docker build -f Dockerfile.worker -t scrutineering-worker:ci .
      - run: docker build -f Dockerfile.dashboard -t scrutineering-dashboard:ci .

  # ------------------------------------------------
  # Security scanning (Trivy image scan of built image)
  # ------------------------------------------------
  security-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t scrutineering-api:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scrutineering-api:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
