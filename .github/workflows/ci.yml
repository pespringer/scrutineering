name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  # ------------------------------------------------
  # Repository checks — docs links, deployment and frontend config
  # ------------------------------------------------
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make check

  # ------------------------------------------------
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      # High or critical advisories in what ships block the job. Dev tooling (ESLint and its
      # resolvers) is reported but doesn't block, since an advisory there can have no fixed release.
      - working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - working-directory: dashboard
        run: npm audit --audit-level=high || echo "::warning::npm audit found advisories in dev dependencies"
      - working-directory: dashboard
        run: npm run lint
      - working-directory: dashboard
        run: npm run validate:build

  # ------------------------------------------------
  # Formatting and lint (ground rule 5: Ruff, Prettier, 120-character lines)
  # ------------------------------------------------
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - run: make fmt-check

  # ------------------------------------------------
  # Python Services — lint, test
  # ------------------------------------------------
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest tests/ -v

  # ------------------------------------------------
  # Docker build (API + worker + dashboard images)
  # ------------------------------------------------
  docker-build:
    needs: [repo-checks, test-python, format-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.api -t scrutineering-api:ci .
      - run: docker build -f Dockerfile.worker -t scrutineering-worker:ci .
      - run: docker build -f Dockerfile.dashboard -t scrutineering-dashboard:ci .

  # ------------------------------------------------
  # Security scanning (Trivy image scan of built image)
  # ------------------------------------------------
  security-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f Dockerfile.api -t scrutineering-api:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scrutineering-api:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: 'true'
