name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  TRIVY_SEVERITY: CRITICAL,HIGH
  GRYPE_SEVERITY_THRESHOLD: High

jobs:
  # ------------------------------------------------
  # Node.js Services — lint, test, build
  # ------------------------------------------------
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx ajv compile -s "schemas/policy-contract/*.json" 2>/dev/null || echo "No JSON schemas to validate"
      - run: npm run validate:evidence-contract
      - run: npm test
      - run: node scripts/run-remediation-dry-run-harness.mjs
      - run: node scripts/run-verification-harness.mjs
      - run: npm run drill:staging-rollback
      - run: npm run drill:staging-evidence
      - run: npm run drill:staging-readiness
      - run: npm run validate:deployment
      - run: npm run validate:docs
      - run: npm run validate:frontend

  # ------------------------------------------------
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm audit --audit-level=high
      - working-directory: dashboard
        run: npm run validate:build

  # ------------------------------------------------
  # Python Services — lint, test
  # ------------------------------------------------
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest tests/ -v

  # ------------------------------------------------
  # Docker build (planner + worker images)
  # ------------------------------------------------
  docker-build:
    needs: [test-node, test-python]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t scrutineering-planner:ci .
      - run: docker build -f Dockerfile.worker -t scrutineering-worker:ci .
      - run: docker build -f Dockerfile.dashboard -t scrutineering-dashboard:ci .

  # ------------------------------------------------
  # Security scanning (Trivy image scan of built image)
  # ------------------------------------------------
  security-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build planner image
        run: docker build -f Dockerfile -t scrutineering-planner:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scrutineering-planner:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
