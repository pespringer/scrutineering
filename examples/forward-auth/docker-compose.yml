# Sign-in for Scrutineering with Traefik and Authelia (docs/design/forward-auth.md), on top of the stack:
#
#   docker compose --env-file .env --env-file examples/forward-auth/example.env \
#     -f docker-compose.yml -f examples/forward-auth/docker-compose.yml up -d
#
# Then open https://scrutineering.localhost:8443 (examples/forward-auth/README.md).
# Paths here are relative to the repository root, where docker-compose.yml is.
services:
  traefik:
    image: traefik:v3.3.5
    container_name: scrutineering-traefik
    command:
      - --entrypoints.websecure.address=:8443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=INFO
    environment:
      - DASHBOARD_TRUSTED_PROXY_SECRET=${DASHBOARD_TRUSTED_PROXY_SECRET:?see examples/forward-auth/example.env}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./examples/forward-auth/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - scrutineering
    depends_on:
      - authelia
      - dashboard

  authelia:
    image: authelia/authelia:4.38.17
    container_name: scrutineering-authelia
    environment:
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:?}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}
    volumes:
      - ./examples/forward-auth/authelia/configuration.yml:/config/configuration.yml:ro
      - ./examples/forward-auth/authelia/users.yml:/config/users.yml:ro
      - autheliadata:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - scrutineering

  # Reachable only through Traefik: no published port, and every request needs a signed-in user.
  dashboard:
    ports: !reset []
    environment:
      - DASHBOARD_AUTH_MODE=trusted-proxy
      - DASHBOARD_AUTH_HEADERS=authelia
      - DASHBOARD_TRUSTED_PROXY_SECRET=${DASHBOARD_TRUSTED_PROXY_SECRET:?}
      - DASHBOARD_LOGOUT_URL=https://auth.scrutineering.localhost:8443/logout?rd=https://scrutineering.localhost:8443

  api:
    environment:
      - DASHBOARD_AUTH_MODE=trusted-proxy
      - DASHBOARD_TRUSTED_PROXY_SECRET=${DASHBOARD_TRUSTED_PROXY_SECRET:?}
      - DASHBOARD_GROUP_ROLES=${DASHBOARD_GROUP_ROLES:?}

volumes:
  autheliadata:
