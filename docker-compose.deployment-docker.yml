# Opt-in Docker Engine access for the scan worker, used by runtime discovery
# (SCAN_RUNTIME_DISCOVERY_ENABLED=true). This grants the worker access to the
# Docker Engine API; use only on a dedicated host and set DOCKER_SOCKET_GID to
# the host socket's group ID.
services:
  celery-worker:
    group_add:
      - "${DOCKER_SOCKET_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
