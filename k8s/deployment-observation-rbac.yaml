---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scrutineering-worker
  labels:
    app: scrutineering-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scrutineering-worker-deployment-observer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scrutineering-worker-deployment-observer
subjects:
  - kind: ServiceAccount
    name: scrutineering-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scrutineering-worker-deployment-observer
