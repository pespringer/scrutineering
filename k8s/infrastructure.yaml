---
# ConfigMap — Application defaults
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrutineering-config
data:
  SCANNER_TIMEOUT: "1800"
  SCHEDULE_CRON_SCAN: "0 */6 * * *"
  CELERY_QUEUES: "scan.low,scan.normal,scan.high,remediation.normal,notify"
  SCRUTINEERING_VERSION: "0.1.0"
  SCRUTINEERING_REVISION: "managed-by-release"
  SCANNER_MAX_OUTPUT_BYTES: "50000000"
  SCANNER_MAX_FINDINGS: "100000"
  SCAN_COOLDOWN_SECONDS: "3600"
  SERVICE_AUTH_MAX_SKEW_SECONDS: "300"
  SERVICE_AUTH_REQUIRED: "true"
  DASHBOARD_DEFAULT_ROLES: "dashboard,operator"
  # Remediation candidates are built on buildkitd (buildkit/buildkit.yaml) and pushed to the
  # in-cluster registry (registry.yaml), which speaks plain HTTP inside the cluster.
  BUILDKIT_HOST: "tcp://buildkitd.scrutineering-buildkit.svc.cluster.local:1234"
  LOCAL_REGISTRY_HOST: "scrutineering-registry.scrutineering.svc.cluster.local:5000"
  REGISTRY_INSECURE: "true"
  # Set to "true" to let approved remediations build and verify candidates.
  REMEDIATION_EXECUTION_ENABLED: "false"
---
# Secret — Sensitive values (base64 encoded)
apiVersion: v1
kind: Secret
metadata:
  name: scrutineering-secrets
type: Opaque
stringData:
  # POSTGRES_PASSWORD must match the password in DATABASE_URL.
  POSTGRES_PASSWORD: "change-me-secret"
  DATABASE_URL: "postgresql://scrutineering:change-me-secret@scrutineering-postgres:5432/scrutineering"
  REDIS_URL: "redis://scrutineering-redis:6379/0"
  CELERY_BROKER_URL: "redis://scrutineering-redis:6379/0"
  PYTHON_API_KEY: "replace-with-a-strong-dashboard-api-key"
  DASHBOARD_TRUSTED_PROXY_SECRET: "replace-with-a-trusted-ingress-secret"
---
# Deployment — PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutineering-postgres
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The postgres user of the official image.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: scrutineering-secrets
          env:
            - name: POSTGRES_DB
              value: scrutineering
            - name: POSTGRES_USER
              value: scrutineering
            # A subdirectory, because a fresh volume's root may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: run
          emptyDir: {}
---
# PersistentVolumeClaim — PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Deployment — Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutineering-redis
  labels:
    app: redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The redis user of the official image.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Redis holds the queue and results only; nothing here needs to survive a restart.
        - name: data
          emptyDir: {}
