apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrutineering-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrutineering-api-allow-dashboard
spec:
  podSelector:
    matchLabels:
      app: scrutineering-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: scrutineering-dashboard
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrutineering-worker-egress
spec:
  podSelector:
    matchLabels:
      app: scrutineering-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
