---
# Deployment — Next.js operations dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutineering-dashboard
  labels:
    app: scrutineering-dashboard
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrutineering-dashboard
  template:
    metadata:
      labels:
        app: scrutineering-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: scrutineering-dashboard:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3001"
            - name: DASHBOARD_API_URL
              value: "http://scrutineering-api:8000"
            - name: DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scrutineering-secrets
                  key: PYTHON_API_KEY
            - name: DASHBOARD_AUTH_MODE
              value: "trusted-proxy"
            - name: DASHBOARD_TRUSTED_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: scrutineering-secrets
                  key: DASHBOARD_TRUSTED_PROXY_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
