---
# Deployment — Authenticated Python dashboard/data API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutineering-api
  labels:
    app: scrutineering-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrutineering-api
  template:
    metadata:
      labels:
        app: scrutineering-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: scrutineering-api:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: scrutineering-secrets
            - configMapRef:
                name: scrutineering-config
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
