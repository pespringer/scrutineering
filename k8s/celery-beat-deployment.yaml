---
# Deployment — Celery Beat (scheduler)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutineering-celery-beat
  labels:
    app: scrutineering-celery-beat
    tier: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrutineering-celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: scrutineering-celery-beat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-beat
          image: scrutineering-worker:latest
          command:
            - "celery"
            - "--app=src.scan.tasks:app"
            - "beat"
            - "--loglevel=info"
            - "--scheduler=celery.beat:PersistentScheduler"
            - "--pidfile=/tmp/celerybeat.pid"
            - "--schedule=/tmp/celerybeat-schedule"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: scrutineering-secrets
            - configMapRef:
                name: scrutineering-config
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
