---
# Deployment — Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutineering-worker
  labels:
    app: scrutineering-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrutineering-worker
  template:
    metadata:
      labels:
        app: scrutineering-worker
    spec:
      serviceAccountName: scrutineering-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # Lets the worker's user read the signing-key Secret (mode 0440).
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: scrutineering-worker:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The image's command runs `celery --app=src.scan.tasks:app worker` on CELERY_QUEUES.
          env:
            # The root filesystem is read-only; git and npm need a writable home.
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: scrutineering-secrets
            - configMapRef:
                name: scrutineering-config
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: signing-keys
              mountPath: /var/lib/scrutineering/signing
              readOnly: true
      volumes:
        # The key that signs SBOMs and evidence (src/signing.py), shared by every worker replica. Create it
        # once (README "Kubernetes"); until it exists, exports are stored unsigned and the worker logs why.
        - name: signing-keys
          secret:
            secretName: scrutineering-signing-key
            optional: true
            defaultMode: 0440
            items:
              - key: private.pem
                path: private.pem
        - name: tmp
          # Source checkouts, npm caches and scanner caches.
          emptyDir:
            sizeLimit: 8Gi
