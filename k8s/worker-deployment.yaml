---
# Deployment — Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutineering-worker
  labels:
    app: scrutineering-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrutineering-worker
  template:
    metadata:
      labels:
        app: scrutineering-worker
    spec:
      containers:
        - name: worker
          image: scrutineering-worker:latest
          command:
            - "celery"
            - "--app=src.scan.celery_app:create_celery_app"
            - "worker"
            - "--loglevel=info"
            - "--concurrency=4"
          envFrom:
            - secretRef:
                name: scrutineering-secrets
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "4"
              memory: "4Gi"
