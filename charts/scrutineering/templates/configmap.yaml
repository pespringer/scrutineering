apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scrutineering.fullname" . }}-config
  labels: {{- include "scrutineering.labels" . | nindent 4 }}
data:
  PLANNER_HOST: "0.0.0.0"
  PLANNER_PORT: "3000"
  TRIVY_SEVERITY: {{ .Values.config.trivySeverity | quote }}
  GRYPE_SEVERITY_THRESHOLD: {{ .Values.config.grypeSeverityThreshold | quote }}
  SCANNER_TIMEOUT: {{ .Values.config.scannerTimeout | quote }}
  CELERY_QUEUES: {{ .Values.config.celeryQueues | quote }}
  SCRUTINEERING_VERSION: {{ .Values.config.scrutineeringVersion | quote }}
  SCRUTINEERING_REVISION: {{ .Values.config.scrutineeringRevision | quote }}
  DASHBOARD_DEFAULT_ROLES: {{ .Values.config.dashboardDefaultRoles | quote }}
  SERVICE_AUTH_REQUIRED: {{ .Values.config.serviceAuthRequired | quote }}
