{{- if .Values.secrets.create }}
{{- if .Values.secrets.existingSecret }}
{{- fail "secrets.existingSecret cannot be set when secrets.create is true" }}
{{- end }}
{{- $database := required "secrets.databaseUrl is required when secrets.create is true" .Values.secrets.databaseUrl }}
{{- $postgresPassword := "" }}
{{- if .Values.postgres.enabled }}
{{- $postgresPassword = required "secrets.postgresPassword is required when postgres.enabled is true" .Values.secrets.postgresPassword }}
{{- end }}
{{- $redis := required "secrets.redisUrl is required when secrets.create is true" .Values.secrets.redisUrl }}
{{- $broker := required "secrets.celeryBrokerUrl is required when secrets.create is true" .Values.secrets.celeryBrokerUrl }}
{{- $apiKey := required "secrets.pythonApiKey is required when secrets.create is true" .Values.secrets.pythonApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scrutineering.secretName" . }}
  labels:
{{ include "scrutineering.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $database | quote }}
{{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
{{- end }}
  REDIS_URL: {{ $redis | quote }}
  CELERY_BROKER_URL: {{ $broker | quote }}
  PYTHON_API_KEY: {{ $apiKey | quote }}
  DASHBOARD_TRUSTED_PROXY_SECRET: {{ .Values.secrets.dashboardTrustedProxySecret | quote }}
  REMEDIATION_APPROVAL_SECRET: {{ .Values.secrets.remediationApprovalSecret | quote }}
{{- end }}
