replicaCount:
  planner: 2
  api: 2
  dashboard: 2
  worker: 2

images:
  planner: { repository: scrutineering-planner, tag: latest, pullPolicy: IfNotPresent }
  api: { repository: scrutineering-api, tag: latest, pullPolicy: IfNotPresent }
  dashboard: { repository: scrutineering-dashboard, tag: latest, pullPolicy: IfNotPresent }
  worker: { repository: scrutineering-worker, tag: latest, pullPolicy: IfNotPresent }

service:
  planner: { type: ClusterIP, port: 3000 }
  api: { type: ClusterIP, port: 8000 }
  dashboard: { type: ClusterIP, port: 3001 }

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: scrutineering.local
  path: /
  tls: []

postgres:
  enabled: true
  image: postgres:16
  storage: 10Gi
  database: scrutineering
  username: scrutineering

redis:
  enabled: true
  image: redis:7-alpine
  storage: 1Gi

backup:
  storage: 10Gi

secrets:
  create: true
  existingSecret: ""
  databaseUrl: ""
  postgresPassword: ""
  redisUrl: ""
  celeryBrokerUrl: ""
  pythonApiKey: ""
  dashboardTrustedProxySecret: ""
  remediationApprovalSecret: ""

config:
  dashboardAuthMode: trusted-proxy
  dashboardDefaultRoles: dashboard,operator
  serviceAuthRequired: "true"
  trivySeverity: CRITICAL,HIGH
  grypeSeverityThreshold: High
  scannerTimeout: "1800"
  celeryQueues: scan.low,scan.normal,scan.high,remediation.normal
  scrutineeringVersion: 0.1.0
  scrutineeringRevision: managed-by-helm

resources:
  planner: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "2", memory: 2Gi } }
  api: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
  dashboard: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
  worker: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "4", memory: 4Gi } }

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
