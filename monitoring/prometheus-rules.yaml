groups:
  - name: scrutineering-operational-slos
    interval: 30s
    rules:
      - alert: ScrutineeringScanFailureRateHigh
        expr: >-
          sum(rate(scrutineering_scans_total{status="failed"}[5m]))
          /
          clamp_min(sum(rate(scrutineering_scans_total[5m])), 1) > 0.10
        for: 10m
        labels:
          severity: warning
          owner: platform-security
        annotations:
          summary: "Scrutineering scan failure rate is elevated"
          runbook: "docs/operations/on-call-playbook.md"
      - alert: ScrutineeringScanLatencyP95High
        expr: >-
          max(scrutineering_scan_latency_seconds{quantile="0.95"}) > 300
        for: 10m
        labels:
          severity: warning
          owner: platform-security
        annotations:
          summary: "Scrutineering scan latency P95 exceeds five minutes"
          runbook: "docs/operations/scan-queues.md"
      - alert: ScrutineeringRuntimeEventsDeadLettered
        expr: increase(scrutineering_runtime_events_dead_lettered_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
          owner: platform-security
        annotations:
          summary: "Runtime events were dead-lettered"
          runbook: "docs/operations/runtime-backpressure.md"
      - alert: ScrutineeringProviderCallbackRejected
        expr: increase(scrutineering_provider_callbacks_total{outcome="rejected"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          owner: platform-security
        annotations:
          summary: "Provider webhook signatures were rejected"
          runbook: "docs/operations/staging-provider-post-merge.md"
      - alert: ScrutineeringProviderCallbackReplayOrUnmatched
        expr: >-
          increase(scrutineering_provider_callbacks_total{outcome=~"duplicate|unmatched"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
          owner: platform-security
        annotations:
          summary: "Provider callbacks were replayed or unmatched"
          runbook: "docs/operations/staging-provider-post-merge.md"
      - alert: ScrutineeringProviderCallbackRollbackRequired
        expr: increase(scrutineering_provider_callbacks_total{outcome="rollback_required"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          owner: platform-security
        annotations:
          summary: "A provider callback requires remediation rollback"
          runbook: "docs/operations/staging-provider-post-merge.md"
      - alert: ScrutineeringStalePublications
        expr: scrutineering_stale_publications > 0
        for: 10m
        labels:
          severity: warning
          owner: platform-security
        annotations:
          summary: "Provider publications require reconciliation"
          runbook: "docs/operations/staging-provider-post-merge.md"
      - alert: ScrutineeringPublicationRecoveryEscalated
        expr: increase(scrutineering_recovery_escalations_total[15m]) > 0
        for: 2m
        labels:
          severity: critical
          owner: platform-security
        annotations:
          summary: "A stale provider publication has escalated to manual review"
          runbook: "docs/operations/staging-provider-post-merge.md"
      - alert: ScrutineeringRecoveryProviderFailures
        expr: increase(scrutineering_recovery_polls_total{outcome=~"rate_limited|circuit_open|failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          owner: platform-security
        annotations:
          summary: "Provider recovery polling is failing or rate limited"
          runbook: "docs/operations/staging-provider-post-merge.md"
